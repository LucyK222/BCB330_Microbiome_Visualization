<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BCB330 Microbiome Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>BCB330 Microbiome Visualization</h1>
  <p>Interactive exploration of microbiome composition and metabolic pathways</p>
</header>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('violin', this)">Violin Plot</button>
  <button class="tab-btn"        onclick="switchTab('krona',  this)">Krona Chart</button>
</div>

<!-- ── VIOLIN PANEL ── -->
<div id="panel-violin" class="tab-panel active">
  <div class="panel-title">RPKM Distribution by Superpathway — <em>Dorea sp. 5_2</em></div>
  <div id="my_dataviz"></div>
</div>

<!-- ── KRONA PANEL ── -->
<div id="panel-krona" class="tab-panel">
  <div class="panel-title">Taxonomic Composition (Krona)</div>

  <!-- switch -->
  <div class="krona-toggle">
    <span>Data source:</span>
    <label class="toggle-label">
      <input type="radio" name="kronaMode" value="reads" checked> Read Counts
    </label>
    <label class="toggle-label">
      <input type="radio" name="kronaMode" value="rpkm"> RPKM
    </label>
  </div>

  <!-- sync button -->
  <button id="btn-sync-violin" style="display:none" onclick="syncViolinToKrona()">
    Sync to Violin
  </button>

  <!-- Sliders -->
  <div class="slider-panel">
    <div class="slider-group">
      <label>Top <span id="val-phylum">5</span> Phyla</label>
      <input type="range" id="slider-phylum" min="1" max="50" value="5">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-class">5</span> Classes</label>
      <input type="range" id="slider-class" min="1" max="30" value="5">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-order">5</span> Orders</label>
      <input type="range" id="slider-order" min="1" max="50" value="5">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-family">5</span> Families</label>
      <input type="range" id="slider-family" min="1" max="50" value="5">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-genus">10</span> Genera</label>
      <input type="range" id="slider-genus" min="1" max="100" value="10">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-species">20</span> Species</label>
      <input type="range" id="slider-species" min="1" max="200" value="20">
    </div>
  </div>

  <div id="chart"></div>
</div>

<div id="tooltip"></div>

<!-- ════════════════════════════════════════════
     TAB SWITCHING
════════════════════════════════════════════ -->
<script>
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');

    if (name === 'violin' && !window._violinLoaded) { drawViolin(); window._violinLoaded = true; }
    if (name === 'krona'  && !window._kronaLoaded)  {
      window._kronaLoaded = true;
      loadAndDrawKrona();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    drawViolin();
    window._violinLoaded = true;
  });

  // ── Mode toggle ──────────────────────────────────────────────
  let kronaMode = 'reads';
  let kronaCurrentNode = null;

  function getKronaFile() {
    return kronaMode === 'reads' ? './data/taxa_complete.json' : './data/taxa_rpkm.json';
  }

  function loadAndDrawKrona() {
    fetch(getKronaFile())
            .then(r => r.json())
            .then(data => {
              window._kronaData = data;
              rebuildKrona();
            })
            .catch(err => console.error("Failed to load krona data:", err));
  }

  document.querySelectorAll('input[name="kronaMode"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      kronaMode = e.target.value;   // ← update FIRST
      document.getElementById('btn-sync-violin').style.display =
              kronaMode === 'rpkm' ? 'inline-block' : 'none';  // ← then check
      window._kronaData = null;
      loadAndDrawKrona();
    });
  });
</script>

<!-- ════════════════════════════════════════════
     KRONA SLIDERS + FILTERING
════════════════════════════════════════════ -->
<script>
  // Read current slider values
  function getTopN() {
    return {
      phylum:  +document.getElementById('slider-phylum').value,
      class:   +document.getElementById('slider-class').value,
      order:   +document.getElementById('slider-order').value,
      family:  +document.getElementById('slider-family').value,
      genus:   +document.getElementById('slider-genus').value,
      species: +document.getElementById('slider-species').value,
    };
  }

  // Wire up sliders — update label and redraw on change
  ['phylum','class','order','family','genus','species'].forEach(level => {
    const slider = document.getElementById('slider-' + level);
    const label  = document.getElementById('val-' + level);
    slider.addEventListener('input', () => {
      label.textContent = slider.value;
      if (window._kronaData) rebuildKrona();
    });
  });

  // Clear chart div and redraw with current slider settings
  function rebuildKrona() {
    const container = document.getElementById('chart');
    container.innerHTML = '';
    const totalValue = nodeValue(window._kronaData); // unfiltered total
    const filtered = filterTree(window._kronaData, getTopN());
    container.appendChild(drawKrona(filtered, totalValue));
  }

  // ── Tree filtering ──────────────────────────────────────────────
  // Full tree depth:  root(0) → Phylum(1) → Class(2) → Order(3) → Family(4) → Genus(5) → Species(6)
  //
  // Phyla are always shown in full (no top-N limit).
  // For every other level, we keep the top-N children by total read count
  // and merge the rest into a single "Other X" node.

  function nodeValue(node) {
    if (node.value !== undefined) return node.value;
    return (node.children || []).reduce((s, c) => s + nodeValue(c), 0);
  }

  function filterChildren(children, topN, otherLabel) {
    if (!children || children.length === 0) return [];
    const sorted = [...children].sort((a, b) => nodeValue(b) - nodeValue(a));
    const kept = sorted.slice(0, topN);
    const rest = sorted.slice(topN);
    if (rest.length > 0) {
      const otherValue = rest.reduce((s, c) => s + nodeValue(c), 0);
      const otherPct   = rest.reduce((s, c) => s + (c.percentage || 0), 0);
      kept.push({ name: otherLabel, value: otherValue, percentage: otherPct });
    }
    return kept;
  }

  function filterTree(root, topN) {
    // depth → { limit, otherLabel }
    // depth 1 = Phylum:  no limit (null)
    // depth 2 = Class,  depth 3 = Order,  depth 4 = Family,
    // depth 5 = Genus,  depth 6 = Species
    const config = {
      1: { limit: topN.phylum,  label: "Other Phyla"    },
      2: { limit: topN.class,   label: "Other Classes"   },
      3: { limit: topN.order,   label: "Other Orders"    },
      4: { limit: topN.family,  label: "Other Families"  },
      5: { limit: topN.genus,   label: "Other Genera"    },
      6: { limit: topN.species, label: "Other Species"   },
    };

    function walk(node, depth) {
      if (!node.children) return { ...node };  // leaf node

      let children = node.children.map(c => walk(c, depth + 1));

      const cfg = config[depth + 1];  // config for children's level
      if (cfg) {
        children = filterChildren(children, cfg.limit, cfg.label);
      }

      const pct = children.reduce((s, c) => s + (c.percentage || 0), 0);
      return { ...node, percentage: pct, children };
    }

    return walk(root, 0);
  }
</script>

<!-- ════════════════════════════════════════════
     VIOLIN  (D3 v7)
════════════════════════════════════════════ -->
<script>
  function drawViolin() {
    var margin = {top: 10, right: 30, bottom: 160, left: 80},
            width  = 900 - margin.left - margin.right,
            height = 500 - margin.top  - margin.bottom;

    var svg = d3.select("#my_dataviz")
            .append("svg")
            .attr("width",  width  + margin.left + margin.right)
            .attr("height", height + margin.top  + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    d3.csv("data/violin_Dorea_sp_5_2.csv").then(function(data) {
      data.forEach(d => { d.RPKM = +d.RPKM; });

      var x = d3.scaleBand()
              .range([0, width])
              .domain([...new Set(data.map(d => d.superpathway))])
              .padding(0.05);
      svg.append("g")
              .attr("transform", "translate(0," + height + ")")
              .call(d3.axisBottom(x))
              .selectAll("text")
              .style("text-anchor", "end")
              .attr("dx", "-.8em").attr("dy", ".15em")
              .attr("transform", "rotate(-40)");

      var y = d3.scaleLinear()
              .domain([0, d3.max(data, d => d.RPKM) * 1.1])
              .range([height, 0]);
      svg.append("g")
              .call(d3.axisLeft(y))
              .append("text")
              .attr("transform", "rotate(-90)")
              .attr("y", -margin.left + 15)
              .attr("x", -height / 2)
              .attr("dy", "1em")
              .style("text-anchor", "middle")
              .style("fill", "black")
              .style("font-size", "12px")
              .style("font-weight", "bold")
              .text("RPKM");

      var histogram = d3.bin()
              .domain(y.domain())
              .thresholds(y.ticks(20))
              .value(d => d);

      var groups = d3.group(data, d => d.superpathway);

      var sumstat = Array.from(groups, ([key, values]) => ({
        key, value: histogram(values.map(g => g.RPKM))
      }));

      var boxStats = Array.from(groups, ([key, values]) => {
        const vals = values.map(g => g.RPKM).sort(d3.ascending);
        return { key, value: {
            q1: d3.quantile(vals, 0.25), median: d3.quantile(vals, 0.5),
            q3: d3.quantile(vals, 0.75), min: d3.min(vals), max: d3.max(vals)
          }};
      });

      var maxNum = d3.max(sumstat, d => d3.max(d.value, b => b.length));
      var xNum = d3.scaleLinear().range([0, x.bandwidth()]).domain([-maxNum, maxNum]);

      svg.selectAll("myViolin").data(sumstat).enter()
              .append("g").attr("transform", d => "translate(" + x(d.key) + ",0)")
              .append("path").datum(d => d.value)
              .style("stroke", "none").style("fill", "#69b3a2")
              .attr("d", d3.area()
                      .x0(d => xNum(-d.length)).x1(d => xNum(d.length))
                      .y(d => y(d.x0)).curve(d3.curveCatmullRom));

      var boxWidth = x.bandwidth() * 0.15;

      svg.selectAll("boxplot").data(boxStats).enter().append("rect")
              .attr("x", d => x(d.key) + x.bandwidth()/2 - boxWidth/2)
              .attr("width", boxWidth)
              .attr("y", d => y(d.value.q3))
              .attr("height", d => y(d.value.q1) - y(d.value.q3))
              .style("fill", "black").style("fill-opacity", 0.05).style("stroke", "black");

      svg.selectAll("medianLine").data(boxStats).enter().append("line")
              .attr("x1", d => x(d.key) + x.bandwidth()/2 - boxWidth/2)
              .attr("x2", d => x(d.key) + x.bandwidth()/2 + boxWidth/2)
              .attr("y1", d => y(d.value.median)).attr("y2", d => y(d.value.median))
              .style("stroke", "black").style("stroke-width", 2);

      svg.selectAll("whisker").data(boxStats).enter().append("line")
              .attr("x1", d => x(d.key) + x.bandwidth()/2)
              .attr("x2", d => x(d.key) + x.bandwidth()/2)
              .attr("y1", d => y(d.value.min)).attr("y2", d => y(d.value.max))
              .style("stroke", "black");

      ["max","min"].forEach(cap => {
        svg.selectAll("whiskerCap-" + cap).data(boxStats).enter().append("line")
                .attr("x1", d => x(d.key) + x.bandwidth()/2 - boxWidth/4)
                .attr("x2", d => x(d.key) + x.bandwidth()/2 + boxWidth/4)
                .attr("y1", d => y(d.value[cap])).attr("y2", d => y(d.value[cap]))
                .style("stroke", "black");
      });
    });
  }
</script>

<!-- ════════════════════════════════════════════
     KRONA  (D3 v7)
════════════════════════════════════════════ -->
<script>
  function drawKrona(data, totalValue) {
    const width  = 800;
    const height = 700;
    const radius = Math.min(width, height) / 6;

    const color = d3.scaleOrdinal(
            d3.quantize(d3.interpolateRainbow, (data.children || []).length + 1)
    );

    const hierarchy = d3.hierarchy(data)
            .sum(d => d.value)
            .sort((a, b) => b.value - a.value);

    // ── KEY FIX: compute the true angular span from actual percentages ──
    // Sum the top-level children's percentages (they are already fractions of the whole)
    function sumPercentage(node) {
      if (node.percentage !== undefined && !node.children) return node.percentage;
      if (node.percentage !== undefined) return node.percentage;
      return (node.children || []).reduce((s, c) => s + sumPercentage(c), 0);
    }

    // The root's real total percentage (may be < 1 because not all taxa are kept)
    const realFraction = (data.children || []).reduce((s, c) => s + (c.percentage || 0), 0);
    // Clamp to [0, 1] just in case
    const angularSpan = 2 * Math.PI * Math.min(realFraction, 1);

    const root = d3.partition()
            .size([angularSpan, hierarchy.height + 1])(hierarchy);
    root.each(d => d.current = d);

    kronaCurrentNode = root;

    const arc = d3.arc()
            .startAngle(d => d.x0)
            .endAngle(d => d.x1)
            .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
            .padRadius(radius * 1.5)
            .innerRadius(d => d.y0 * radius)
            .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));

    const svg = d3.create("svg")
            .attr("viewBox", [-width/2, -height/2, width, height])
            .style("font", "10px sans-serif")
            .style("width",  "100%")
            .style("height", "calc(100vh - 160px)");

    const zoomGroup = svg.append("g");

    const path = zoomGroup.append("g")
            .selectAll("path")
            .data(root.descendants().slice(1))
            .join("path")
            .attr("fill", d => { let e = d; while (e.depth > 1) e = e.parent; return color(e.data.name); })
            .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.6 : 0.4) : 0)
            .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
            .attr("d", d => arc(d.current))
            .on("mousemove", function(event, d) {
              const tooltip = document.getElementById("tooltip");
              const namePath = d.ancestors().map(x => x.data.name).reverse().join(" / ");
              tooltip.style.opacity = 1;
              const metricLabel = kronaMode === 'reads' ? 'Reads' : 'RPKM';
              tooltip.innerHTML = `<strong>${namePath}</strong><br>
                ${metricLabel}: ${kronaMode === 'reads' ? d.value : d.value.toFixed(2)}<br>
                Percentage: ${((d.value / totalValue) * 100).toFixed(2)}%`;
              tooltip.style.left = (event.pageX + 10) + "px";
              tooltip.style.top  = (event.pageY + 10) + "px";
            })
            .on("mouseleave", () => { document.getElementById("tooltip").style.opacity = 0; });

    path.filter(d => d.children).style("cursor","pointer").on("click", clicked);

    const label = zoomGroup.append("g")
            .attr("pointer-events","none").attr("text-anchor","middle")
            .style("user-select","none")
            .selectAll("text")
            .data(root.descendants().slice(1))
            .join("text")
            .attr("dy","0.35em")
            .attr("fill-opacity", d => +labelVisible(d.current))
            .attr("transform",    d => labelTransform(d.current))
            .text(d => d.data.name);

    const parent = zoomGroup.append("circle")
            .datum(root).attr("r", radius)
            .attr("fill","none").attr("pointer-events","all")
            .on("click", clicked);

    function clicked(event, p) {
      kronaCurrentNode = p;
      parent.datum(p.parent || root);
      const span = p.x1 - p.x0;
      root.each(d => d.target = {
        x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / span)) * angularSpan,
        x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / span)) * angularSpan,
        y0: Math.max(0, d.y0 - p.depth),
        y1: Math.max(0, d.y1 - p.depth)
      });

      const t = svg.transition().duration(event.altKey ? 7500 : 750);
      path.transition(t)
              .tween("data", d => { const i = d3.interpolate(d.current, d.target); return t => d.current = i(t); })
              .filter(function(d) { return +this.getAttribute("fill-opacity") || arcVisible(d.target); })
              .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.6 : 0.4) : 0)
              .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
              .attrTween("d", d => () => arc(d.current));
      label.filter(function(d) { return +this.getAttribute("fill-opacity") || labelVisible(d.target); })
              .transition(t)
              .attr("fill-opacity", d => +labelVisible(d.target))
              .attrTween("transform", d => () => labelTransform(d.current));
    }

    function arcVisible(d)   { return d.y1 <= 4 && d.y0 >= 1 && d.x1 > d.x0; }
    function labelVisible(d) { return d.y1 <= 4 && d.y0 >= 1 && (d.y1 - d.y0) * (d.x1 - d.x0) > 0.03; }
    function labelTransform(d) {
      const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
      const y = (d.y0 + d.y1) / 2 * radius;
      return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
    }

    const zoom = d3.zoom().scaleExtent([0.5, 10])
            .on("zoom", event => zoomGroup.attr("transform", event.transform));
    svg.call(zoom);

    return svg.node();
  }
</script>

<script>
  // ════════════════════════════════════════════
  //  EC MAPPING (replicates EC_to_superpath.py)
  // ════════════════════════════════════════════

  function parseEcToMap(text) {
    const ecToMap = {};
    for (const line of text.split("\n")) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      const [left, right] = trimmed.split("\t");
      if (!left || !right) continue;
      const mapId = left.replace("path:", "");
      const ec    = right.replace("ec:", "");
      if (!ecToMap[ec]) ecToMap[ec] = [];
      ecToMap[ec].push(mapId);
    }
    return ecToMap;
  }

  function parseMapToSuper(rows) {
    // rows = array of objects from d3.csv
    const mapToSuper = {};
    for (const row of rows) {
      mapToSuper[row["Pathway ID"]] = row["Superpathway"];
    }
    return mapToSuper;
  }

  function getSuperpathwaysForEc(ec, ecToMap, mapToSuper) {
    const maps = ecToMap[ec] || [];
    const superpaths = new Set();
    for (const m of maps) {
      if (mapToSuper[m]) superpaths.add(mapToSuper[m]);
    }
    return [...superpaths];
  }

  // ════════════════════════════════════════════
  //  SYNC VIOLIN TO KRONA
  // ════════════════════════════════════════════

  async function syncViolinToKrona() {
    // ── 1. Load all data files if not cached ──
    if (!window._rpkmRows) {
      window._rpkmRows = await d3.tsv("databases/RPKM_table.tsv");
    }
    if (!window._ecToMap) {
      const text = await d3.text("databases/EC_pathway.txt");
      window._ecToMap = parseEcToMap(text);
    }
    if (!window._mapToSuper) {
      const rows = await d3.csv("databases/pathway_to_superpathway.csv");
      window._mapToSuper = parseMapToSuper(rows);
    }

    // ── 2. Get visible taxa at current Krona zoom level ──
    let visibleTaxa;
    const cur = kronaCurrentNode;

    if (!cur || cur.depth === 0) {
      // At root — use filtered top-level phylum children
      const filteredRoot = filterTree(window._kronaData, getTopN());
      visibleTaxa = (filteredRoot.children || [])
              .map(d => d.name)
              .filter(n => !n.startsWith("Other"));
    } else {
      // Drilled into a node — use its direct children from filtered tree
      visibleTaxa = (cur.data.children || [])
              .map(d => d.name)
              .filter(n => !n.startsWith("Other"));
    }

    if (visibleTaxa.length === 0) {
      alert("No visible taxa found in current Krona view.");
      return;
    }

// ── 3. Find which of those taxa exist as columns in RPKM table ──
    const allCols = Object.keys(window._rpkmRows[0]);
    const FIXED = new Set(["GeneID","Length","Reads","EC#","ECF","RPKM","Bacteria"]);
    const taxonCols = allCols.filter(c => !FIXED.has(c));

// Build a lookup from the full kronaData tree:
// for each visible taxon name, collect all leaf-level species names
// under it, then try to match those to RPKM columns
    function collectLeafNames(node) {
      if (!node.children || node.children.length === 0) return [node.name];
      return node.children.flatMap(c => collectLeafNames(c));
    }

    function findNodeInTree(tree, targetName) {
      if (tree.name === targetName) return tree;
      for (const child of tree.children || []) {
        const found = findNodeInTree(child, targetName);
        if (found) return found;
      }
      return null;
    }

// For each visible taxon, find all descendant names and try to match any of them
    const uniqueMatchedCols = new Set();
    const matchedTaxaNames  = new Set();

    for (const taxonName of visibleTaxa) {
      // First try direct substring match on the taxon itself
      const directMatch = taxonCols.find(
              col => col.includes(taxonName) || taxonName.includes(col)
      );
      if (directMatch) {
        uniqueMatchedCols.add(directMatch);
        matchedTaxaNames.add(taxonName);
        continue;
      }

      // No direct match — find this node in the full unfiltered tree
      // and try all its descendants
      const node = findNodeInTree(window._kronaData, taxonName);
      if (node) {
        const leaves = collectLeafNames(node);
        for (const leafName of leaves) {
          const leafMatch = taxonCols.find(
                  col => col.includes(leafName) || leafName.includes(col)
          );
          if (leafMatch) {
            uniqueMatchedCols.add(leafMatch);
            matchedTaxaNames.add(taxonName);
          }
        }
      }
    }

    if (uniqueMatchedCols.size === 0) {
      alert(`None of the visible taxa matched columns in RPKM table.\nVisible: ${visibleTaxa.join(", ")}`);
      return;
    }

    const matchedColsArray = [...uniqueMatchedCols];

    // ── 4. Filter rows: EC# valid + at least one matched taxon col non-zero ──
    const filteredRows = window._rpkmRows.filter(row => {
      if (!row["EC#"] || row["EC#"] === "0.0.0.0") return false;
      return matchedColsArray.some(col => {
        const v = parseFloat(row[col]);
        return !isNaN(v) && v !== 0;
      });
    });

    if (filteredRows.length === 0) {
      alert("No matching rows found after filtering.");
      return;
    }

    // ── 5. Map EC# → superpathway, expand rows ──
    const flatData = [];
    for (const row of filteredRows) {
      const rpkm   = parseFloat(row["RPKM"]);
      if (isNaN(rpkm)) continue;

      const ecRaw  = row["EC#"];
      const ecs    = ecRaw.split("|").map(e => e.trim());

      for (const ec of ecs) {
        const superpaths = getSuperpathwaysForEc(ec, window._ecToMap, window._mapToSuper);
        for (const sp of superpaths) {
          flatData.push({ superpathway: sp, RPKM: rpkm });
        }
      }
    }

    if (flatData.length === 0) {
      alert("No superpathway mappings found for the filtered genes.");
      return;
    }

    // ── 6. Switch to violin tab and draw ──
    const violinBtn = document.querySelector('.tab-btn');
    switchTab('violin', violinBtn);

    const title = `RPKM by Superpathway — ${visibleTaxa.join(", ")}`;
    drawViolinFromData(flatData, title);
  }

  // ════════════════════════════════════════════
  //  GENERIC VIOLIN DRAWER (used by sync)
  // ════════════════════════════════════════════

  function drawViolinFromData(flatData, title) {
    d3.select("#my_dataviz").selectAll("*").remove();
    document.querySelector("#panel-violin .panel-title").textContent = title;

    var margin = {top: 10, right: 30, bottom: 160, left: 80},
            width  = 900 - margin.left - margin.right,
            height = 500 - margin.top  - margin.bottom;

    var svg = d3.select("#my_dataviz")
            .append("svg")
            .attr("width",  width  + margin.left + margin.right)
            .attr("height", height + margin.top  + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

    const domain = [...new Set(flatData.map(d => d.superpathway))].sort();

    var x = d3.scaleBand().range([0, width]).domain(domain).padding(0.05);
    svg.append("g")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(x))
            .selectAll("text")
            .style("text-anchor", "end")
            .attr("dx", "-.8em").attr("dy", ".15em")
            .attr("transform", "rotate(-40)");

    var y = d3.scaleLinear()
            .domain([0, d3.max(flatData, d => d.RPKM) * 1.1])
            .range([height, 0]);
    svg.append("g")
            .call(d3.axisLeft(y))
            .append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -margin.left + 15).attr("x", -height / 2)
            .attr("dy", "1em")
            .style("text-anchor", "middle").style("fill", "black")
            .style("font-size", "12px").style("font-weight", "bold")
            .text("RPKM");

    var histogram = d3.bin()
            .domain(y.domain())
            .thresholds(y.ticks(20))
            .value(d => d);

    var groups   = d3.group(flatData, d => d.superpathway);
    var sumstat  = Array.from(groups, ([key, values]) => ({
      key, value: histogram(values.map(g => g.RPKM))
    }));
    var boxStats = Array.from(groups, ([key, values]) => {
      const vals = values.map(g => g.RPKM).sort(d3.ascending);
      return { key, value: {
          q1:     d3.quantile(vals, 0.25),
          median: d3.quantile(vals, 0.5),
          q3:     d3.quantile(vals, 0.75),
          min:    d3.min(vals),
          max:    d3.max(vals)
        }};
    });

    var maxNum = d3.max(sumstat, d => d3.max(d.value, b => b.length));
    var xNum   = d3.scaleLinear().range([0, x.bandwidth()]).domain([-maxNum, maxNum]);

    svg.selectAll("myViolin").data(sumstat).enter()
            .append("g").attr("transform", d => `translate(${x(d.key)},0)`)
            .append("path").datum(d => d.value)
            .style("stroke", "none")
            .style("fill", (d, i) => d3.schemeTableau10[i % 10])
            .attr("d", d3.area()
                    .x0(d => xNum(-d.length)).x1(d => xNum(d.length))
                    .y(d => y(d.x0)).curve(d3.curveCatmullRom));

    var boxWidth = x.bandwidth() * 0.15;
    svg.selectAll("boxplot").data(boxStats).enter().append("rect")
            .attr("x", d => x(d.key) + x.bandwidth()/2 - boxWidth/2)
            .attr("width", boxWidth)
            .attr("y", d => y(d.value.q3))
            .attr("height", d => y(d.value.q1) - y(d.value.q3))
            .style("fill", "black").style("fill-opacity", 0.05).style("stroke", "black");

    svg.selectAll("medianLine").data(boxStats).enter().append("line")
            .attr("x1", d => x(d.key) + x.bandwidth()/2 - boxWidth/2)
            .attr("x2", d => x(d.key) + x.bandwidth()/2 + boxWidth/2)
            .attr("y1", d => y(d.value.median)).attr("y2", d => y(d.value.median))
            .style("stroke", "black").style("stroke-width", 2);

    svg.selectAll("whisker").data(boxStats).enter().append("line")
            .attr("x1", d => x(d.key) + x.bandwidth()/2)
            .attr("x2", d => x(d.key) + x.bandwidth()/2)
            .attr("y1", d => y(d.value.min)).attr("y2", d => y(d.value.max))
            .style("stroke", "black");

    ["max", "min"].forEach(cap => {
      svg.selectAll(`whiskerCap-${cap}`).data(boxStats).enter().append("line")
              .attr("x1", d => x(d.key) + x.bandwidth()/2 - boxWidth/4)
              .attr("x2", d => x(d.key) + x.bandwidth()/2 + boxWidth/4)
              .attr("y1", d => y(d.value[cap])).attr("y2", d => y(d.value[cap]))
              .style("stroke", "black");
    });
  }
</script>
