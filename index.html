<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BCB330 Microbiome Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>BCB330 Microbiome Visualization</h1>
  <p>Interactive exploration of microbiome composition and metabolic pathways</p>
</header>

<div class="tab-bar">
  <!-- data-tab replaces inline onclick="switchTab('violin', this)" -->
  <button class="tab-btn active" data-tab="violin">Violin Plot</button>
  <button class="tab-btn"        data-tab="krona">Krona Chart</button>
  <button class="tab-btn"        data-tab="composition">Composition</button>
</div>

<!-- ── VIOLIN PANEL ── -->
<div id="panel-violin" class="tab-panel active">
  <div class="panel-title">RPKM Distribution by Superpathway — <em>Dorea sp. 5_2</em></div>
  <div id="my_dataviz"></div>
</div>

<!-- ── KRONA PANEL ── -->
<div id="panel-krona" class="tab-panel">
  <div class="panel-title">Taxonomic Composition (Krona)</div>

  <div class="krona-toggle">
    <span>Data source:</span>
    <label class="toggle-label">
      <input type="radio" name="kronaMode" value="reads" checked> Read Counts
    </label>
    <label class="toggle-label">
      <input type="radio" name="kronaMode" value="rpkm"> RPKM
    </label>
  </div>

  <!-- onclick removed — wired in main.js via addEventListener -->
  <button id="btn-sync-violin" style="display:none">
    Sync to Violin
  </button>

  <div class="slider-panel">
    <div class="slider-group">
      <label>Top <span id="val-phylum">5</span> Phyla</label>
      <input type="range" id="slider-phylum" min="1" max="50" value="5">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-class">5</span> Classes</label>
      <input type="range" id="slider-class" min="1" max="30" value="5">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-order">5</span> Orders</label>
      <input type="range" id="slider-order" min="1" max="50" value="5">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-family">5</span> Families</label>
      <input type="range" id="slider-family" min="1" max="50" value="5">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-genus">10</span> Genera</label>
      <input type="range" id="slider-genus" min="1" max="100" value="10">
    </div>
    <div class="slider-group">
      <label>Top <span id="val-species">20</span> Species</label>
      <input type="range" id="slider-species" min="1" max="200" value="20">
    </div>
  </div>

  <div id="chart"></div>
</div>

<!-- ── COMPOSITION PANEL ── -->
<div id="panel-composition" class="tab-panel">
  <div class="panel-title">Taxonomic Composition by Level (RPKM)</div>
  <div id="composition-chart"></div>
</div>

<div id="tooltip"></div>

<!--
  ONE script tag replaces all inline <script> blocks.
  type="module" enables import/export across all js/ files.
  defer is implicit for modules — runs after the DOM is ready.
-->
<script type="module" src="js/main.js"></script>

</body>
</html>
